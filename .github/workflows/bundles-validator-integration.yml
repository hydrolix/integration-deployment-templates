name: Integration Test

on:
  push:
    branches:
      - regression-workflow
  workflow_dispatch:

jobs:
  smoke-test:
    uses: ./.github/workflows/bundle-validator.yml

  integration-test:
    runs-on: ubuntu-latest
    needs: smoke-test
    environment: bundle-validator-env
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker
        run: |
          docker --version
          docker compose version
          
          # Ensure Docker daemon is running
          sudo systemctl status docker || sudo systemctl start docker

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Chrome/Chromium
        run: |
          sudo apt-get install -y chromium-browser chromium-chromedriver
          
          chromium-browser --version
          chromedriver --version
          
          echo "CHROME_BIN=/usr/bin/chromium-browser" >> $GITHUB_ENV
          echo "CHROMEDRIVER_BIN=/usr/bin/chromedriver" >> $GITHUB_ENV

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Integration Tests
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: debug
          CHROME_DEBUG_PORT: 9222
          BUNDLE_TESTING_CLUSTER: ${{ secrets.BUNDLE_TESTING_CLUSTER }}
          BUNDLE_TESTING_USERNAME: ${{ secrets.BUNDLE_TESTING_USERNAME }}
          BUNDLE_TESTING_PASSWORD: ${{ secrets.BUNDLE_TESTING_PASSWORD }}
        run: |          
          cargo run -- --local

      - name: Cleanup
        if: always()
        run: |
          docker stop $(docker ps -q) 2>/dev/null || true
          sleep 2
          docker rm $(docker ps -aq) 2>/dev/null || true
          
          # Kill any remaining chrome processes
          sudo pkill -9 -f chrome 2>/dev/null || true
          sudo pkill -9 -f chromium 2>/dev/null || true