name: push-to-cac

on:
    pull_request:
        types: [closed]
        branches: [main]
    workflow_dispatch:
        inputs:
            pr_number:
                description: 'PR number to simulate (for testing)'
                required: false
                default: '0'

jobs:
    bundle-export:
        if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Integrations Repo
              uses: actions/checkout@v3
              with:
                path: 'integrations-deployment-templates'

            - name: Checkout CAC Repo
              uses: actions/checkout@v3
              with:
                repository: 'hydrolix/cac-tools-test'
                token: ${{ secrets.PUSH_TO_CAC_TOKEN }}
                path: 'cac-tools-test'

            - name: Detect Changed Bundles
              id: detect-bundles
              run: |
                cd integrations-deployment-templates

                # Fetch main branch for comparison
                git fetch origin main

                # Get list of changed files
                CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

                echo "Changed files:"
                echo "$CHANGED_FILES"

                # Extract unique bundle directories (first two path components)
                BUNDLE_DIRS=$(echo "$CHANGED_FILES" | grep -E '^(aws|trafficpeak)/' | cut -d'/' -f1-2 | sort -u)

                if [ -z "$BUNDLE_DIRS" ]; then
                  echo "No bundle directories changed"
                  echo "has_changes=false" >> $GITHUB_OUTPUT
                  echo "bundle_list=" >> $GITHUB_OUTPUT
                else
                  echo "Changed bundle directories:"
                  echo "$BUNDLE_DIRS"

                  # Format bundle list for display
                  BUNDLE_LIST=$(echo "$BUNDLE_DIRS" | sed 's/^/  - /')

                  echo "has_changes=true" >> $GITHUB_OUTPUT
                  echo "bundle_dirs<<EOF" >> $GITHUB_OUTPUT
                  echo "$BUNDLE_DIRS" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT
                  echo "bundle_list<<EOF" >> $GITHUB_OUTPUT
                  echo "$BUNDLE_LIST" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT
                fi

            - name: Export Changed Bundles to CAC
              if: steps.detect-bundles.outputs.has_changes == 'true'
              run: |
                echo "Exporting changed bundles to CAC repository..."

                BUNDLE_DIRS="${{ steps.detect-bundles.outputs.bundle_dirs }}"

                # Process each changed bundle directory
                echo "$BUNDLE_DIRS" | while IFS= read -r bundle_dir; do
                  if [ -n "$bundle_dir" ] && [ -d "integrations-deployment-templates/$bundle_dir" ]; then
                    echo "Copying $bundle_dir..."

                    # Create parent directory structure in CAC repo
                    parent_dir=$(dirname "$bundle_dir")
                    mkdir -p "cac-tools-test/bundles/$parent_dir"

                    # Copy the bundle directory
                    cp -r "integrations-deployment-templates/$bundle_dir" "cac-tools-test/bundles/$bundle_dir"

                    echo "✓ Copied $bundle_dir"
                  fi
                done

                echo "Bundle export completed"

            - name: Create PR in CAC Repo
              if: steps.detect-bundles.outputs.has_changes == 'true'
              run: |
                cd cac-tools-test

                # configure git
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"

                # check for changes
                if [[ -n $(git status --porcelain) ]]; then
                  echo "Changes detected, creating PR..."

                  # set PR number and commit SHA based on trigger type
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    PR_NUMBER="${{ github.event.inputs.pr_number }}"
                    COMMIT_SHA="${{ github.sha }}"
                    TRIGGERED_BY="${{ github.actor }}"
                    TEST_PREFIX="[TEST] "
                  else
                    PR_NUMBER="${{ github.event.pull_request.number }}"
                    COMMIT_SHA="${{ github.event.pull_request.merge_commit_sha }}"
                    TRIGGERED_BY="${{ github.event.pull_request.user.login }}"
                    TEST_PREFIX=""
                  fi

                  # get bundle list
                  BUNDLE_LIST="${{ steps.detect-bundles.outputs.bundle_list }}"

                  # create a new branch for the PR
                  BRANCH_NAME="push-to-cac-${PR_NUMBER}-$(date +%s)"
                  git checkout -b "$BRANCH_NAME"

                  # commit changes
                  git add .
                  git commit -m "${TEST_PREFIX}Push to CaC Bundle from integration-deployment-templates

                  Synced bundles:
                  $BUNDLE_LIST

                  From PR #${PR_NUMBER}
                  Source commit: ${COMMIT_SHA}"

                  # push branch to remote
                  git push origin "$BRANCH_NAME"

                  # create PR using GitHub CLI
                  gh pr create \
                    --title "${TEST_PREFIX}Sync bundles from integration-deployment-templates PR #${PR_NUMBER}" \
                    --body "## Auto-sync from integration-deployment-templates

                  **Synced bundles:**
                  $BUNDLE_LIST

                  **Source PR:** #${PR_NUMBER}
                  **Source commit:** ${COMMIT_SHA}
                  **Triggered by:** @${TRIGGERED_BY}
                  **Trigger type:** ${{ github.event_name }}

                  This PR was automatically generated to sync bundle changes from the integration-deployment-templates repository." \
                    --base main \
                    --head "$BRANCH_NAME"

                  echo "Successfully created PR in CAC repository"
                else
                  echo "No changes to commit"
                fi
              env:
                GH_TOKEN: ${{ secrets.PUSH_TO_CAC_TOKEN }}

        env:
            GITHUB_TOKEN: ${{ secrets.PUSH_TO_CAC_TOKEN }}
            CAC_REPO: 'https://github.com/hydrolix/cac-tools-test'