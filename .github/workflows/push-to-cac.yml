name: push-to-cac

on:
    pull_request:
        types: [closed]
        branches: [main]
    push:
        branches: [push-to-cac]
    workflow_dispatch:

jobs:
    bundle-export:
        if: github.event.pull_request.merged == true || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/create-github-app-token@v2
              id: app-token
              with:
                app-id: ${{ vars.INTEGRATIONS_APP_ID }}
                private-key: ${{ secrets.INTEGRATIONS_APP_PRIVATE_KEY }}
                owner: hydrolix

            - name: Checkout Integrations Repo
              uses: actions/checkout@v3
              with:
                ref: main
                path: 'integrations-deployment-templates'
                fetch-depth: 2

            - name: Checkout CAC Repo
              uses: actions/checkout@v3
              with:
                repository: 'hydrolix/cac-tools-test'
                token: ${{ steps.app-token.outputs.token }}
                path: 'cac-tools-test'

            - name: Detect Portable Bundles to Export
              id: detect-bundles
              run: |
                cd integrations-deployment-templates

                # Get files changed by the merge commit and filter to portables/
                CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- portables/)

                echo "Changed files in portables/:"
                echo "$CHANGED_FILES"

                # Extract unique bundle names (portables/<bundle_name>/...)
                BUNDLE_NAMES=$(echo "$CHANGED_FILES" | cut -d'/' -f2 | sort -u | grep -v '^$')

                if [ -z "$BUNDLE_NAMES" ]; then
                  echo "No portable bundle changes detected"
                  echo "has_changes=false" >> $GITHUB_OUTPUT
                else
                  echo "Bundles to export:"
                  echo "$BUNDLE_NAMES"
                  echo "has_changes=true" >> $GITHUB_OUTPUT
                  echo "bundle_names<<EOF" >> $GITHUB_OUTPUT
                  echo "$BUNDLE_NAMES" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT
                fi

            - name: Copy Portable Bundles to CAC Repo
              if: steps.detect-bundles.outputs.has_changes == 'true'
              run: |
                echo "${{ steps.detect-bundles.outputs.bundle_names }}" | while IFS= read -r bundle; do
                  if [ -n "$bundle" ] && [ -d "integrations-deployment-templates/portables/$bundle" ]; then
                    mkdir -p "cac-tools-test/bundles/$bundle"
                    cp -r "integrations-deployment-templates/portables/$bundle/." "cac-tools-test/bundles/$bundle/"
                    echo "Copied: portables/$bundle → bundles/$bundle"
                  fi
                done

            - name: Create PR in CAC Repo
              if: steps.detect-bundles.outputs.has_changes == 'true'
              run: |
                cd cac-tools-test

                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"

                if [[ -n $(git status --porcelain) ]]; then
                  PR_NUMBER="${{ github.event.pull_request.number || github.run_id }}"
                  COMMIT_SHA="${{ github.sha }}"
                  TRIGGERED_BY="${{ github.event.pull_request.user.login || github.actor }}"

                  BRANCH_NAME="push-to-cac-${PR_NUMBER}-$(date +%s)"
                  git checkout -b "$BRANCH_NAME"

                  git add .
                  git commit -m "Sync portable bundles from integration-deployment-templates PR #${PR_NUMBER}

                  Source commit: ${COMMIT_SHA}
                  Triggered by: @${TRIGGERED_BY}"

                  git push origin "$BRANCH_NAME"

                  gh pr create \
                    --title "Sync portable bundles from integration-deployment-templates PR #${PR_NUMBER}" \
                    --body "## Auto-sync from integration-deployment-templates

                  **Source PR:** hydrolix/integration-deployment-templates#${PR_NUMBER}
                  **Source commit:** ${COMMIT_SHA}
                  **Triggered by:** @${TRIGGERED_BY}

                  This PR was automatically generated to sync portable bundle changes from the integration-deployment-templates repository." \
                    --base main \
                    --head "$BRANCH_NAME"

                  echo "Successfully created PR in CAC repository"
                else
                  echo "No changes to commit"
                fi
              env:
                GH_TOKEN: ${{ steps.app-token.outputs.token }}
