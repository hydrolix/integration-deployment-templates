name: push-to-cac-tools-test

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run against'
        required: true
        type: string

jobs:
  bundle-export:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.review.state == 'approved' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-bundle-ci'))
    runs-on: ubuntu-latest

    steps:
      - name: Resolve PR context
        id: pr-context
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
            HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo ${{ github.repository }} --json headRefOid --jq '.headRefOid')
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          fi
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.INTEGRATIONS_APP_ID }}
          private-key: ${{ secrets.INTEGRATIONS_APP_PRIVATE_KEY }}
          owner: hydrolix

      - name: Checkout Integrations Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-context.outputs.head_sha }}
          path: 'integrations-deployment-templates'
          fetch-depth: 0

      - name: Checkout CAC Test Repo
        uses: actions/checkout@v4
        with:
          repository: 'hydrolix/cac-tools-test'
          token: ${{ steps.app-token.outputs.token }}
          path: 'cac-tools-test'

      - name: Detect portable bundles
        id: detect-bundles
        run: |
          cd integrations-deployment-templates

          # Diff the entire PR branch against main to find all portables changes.
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Extract unique portable bundle names (second path component under portables/)
          PORTABLE_BUNDLES=$(echo "$CHANGED_FILES" | grep -E '^portables/' | cut -d'/' -f2 | sort -u)

          if [ -z "$PORTABLE_BUNDLES" ]; then
            echo "No portable bundle changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Portable bundles to export:"
          echo "$PORTABLE_BUNDLES"

          BUNDLE_LIST=$(echo "$PORTABLE_BUNDLES" | sed 's/^/  - /')

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "portable_bundles<<EOF" >> $GITHUB_OUTPUT
          echo "$PORTABLE_BUNDLES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "bundle_list<<EOF" >> $GITHUB_OUTPUT
          echo "$BUNDLE_LIST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Export portables to CAC
        if: steps.detect-bundles.outputs.has_changes == 'true'
        run: |
          PORTABLE_BUNDLES="${{ steps.detect-bundles.outputs.portable_bundles }}"

          echo "$PORTABLE_BUNDLES" | while IFS= read -r bundle_name; do
            if [ -n "$bundle_name" ] && [ -d "integrations-deployment-templates/portables/$bundle_name" ]; then
              echo "Copying portables/$bundle_name → cac-tools-test/data/bundles/$bundle_name/"

              mkdir -p "cac-tools-test/data/bundles/$bundle_name"
              cp -r "integrations-deployment-templates/portables/$bundle_name/"* "cac-tools-test/data/bundles/$bundle_name/"

              echo "✓ Copied $bundle_name"
            fi
          done

      - name: Create PR in CAC Repo
        if: steps.detect-bundles.outputs.has_changes == 'true'
        run: |
          cd cac-tools-test

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -z $(git status --porcelain) ]]; then
            echo "No changes to commit"
            exit 0
          fi

          PR_NUMBER="${{ steps.pr-context.outputs.pr_number }}"
          COMMIT_SHA="${{ steps.pr-context.outputs.head_sha }}"
          TRIGGERED_BY="${{ github.actor }}"
          TEST_PREFIX="[TEST] "

          BUNDLE_LIST="${{ steps.detect-bundles.outputs.bundle_list }}"

          BRANCH_NAME="push-to-cac-tools-test-${PR_NUMBER}"

          PR_BODY="## Auto-sync from integration-deployment-templates

          **Synced bundles:**
          $BUNDLE_LIST

          **Source PR:** #${PR_NUMBER}
          **Source commit:** \`${COMMIT_SHA}\`
          **Triggered by:** @${TRIGGERED_BY}
          **Trigger type:** PR approval

          This PR was automatically generated to sync portable bundle changes from the integration-deployment-templates repository."

          # Check if an open PR already exists for this branch
          EXISTING_PR=$(gh pr list --repo hydrolix/cac-tools-test --head "$BRANCH_NAME" --state open --json number --jq '.[0].number // empty')

          # Create branch from current state (main + freshly copied portables)
          git checkout -b "$BRANCH_NAME"
          git add .
          git commit -m "${TEST_PREFIX}Push portable bundles from integration-deployment-templates

          Synced bundles:
          $BUNDLE_LIST

          From PR #${PR_NUMBER}
          Source commit: ${COMMIT_SHA}"

          if [ -n "$EXISTING_PR" ]; then
            echo "Existing PR #${EXISTING_PR} found — force-pushing branch and updating PR body"
            git push --force-with-lease origin "$BRANCH_NAME"

            gh pr edit "$EXISTING_PR" \
              --repo hydrolix/cac-tools-test \
              --body "$PR_BODY"

            echo "Successfully updated existing PR #${EXISTING_PR} in CAC repository"
          else
            echo "No existing PR — creating new branch and PR"
            git push origin "$BRANCH_NAME"

            gh pr create \
              --repo hydrolix/cac-tools-test \
              --title "${TEST_PREFIX}Sync portable bundles from integration-deployment-templates PR #${PR_NUMBER}" \
              --body "$PR_BODY" \
              --base main \
              --head "$BRANCH_NAME"

            echo "Successfully created PR in CAC repository"
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
