name: push-to-cac-tools-test

on:
  pull_request_review:
    types: [submitted]

jobs:
  bundle-export:
    if: |
      github.event.review.state == 'approved' &&
      !contains(github.event.pull_request.body, '[skip-bundle-format]')
    runs-on: ubuntu-latest

    steps:
      - name: Verify all CI checks have passed
        run: |
          echo "Checking CI status for PR #${{ github.event.pull_request.number }}..."

          FAILED_CHECKS=$(gh pr checks ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json name,state \
            --jq '[.[] | select(.state != "SUCCESS" and .state != "SKIPPING" and .name != "bundle-export")] | length')

          if [ "$FAILED_CHECKS" -gt "0" ]; then
            echo "The following checks have not passed:"
            gh pr checks ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json name,state \
              --jq '.[] | select(.state != "SUCCESS" and .state != "SKIPPING" and .name != "bundle-export") | "\(.state): \(.name)"'
            exit 1
          fi

          echo "All CI checks have passed."
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.INTEGRATIONS_APP_ID }}
          private-key: ${{ secrets.INTEGRATIONS_APP_PRIVATE_KEY }}
          owner: hydrolix

      - name: Checkout Integrations Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: 'integrations-deployment-templates'
          fetch-depth: 0

      - name: Checkout CAC Test Repo
        uses: actions/checkout@v4
        with:
          repository: 'hydrolix/cac-tools-test'
          token: ${{ steps.app-token.outputs.token }}
          path: 'cac-tools-test'

      - name: Detect portable bundles
        id: detect-bundles
        run: |
          cd integrations-deployment-templates

          # Diff the entire PR branch against main to find all portables changes.
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Extract unique portable bundle names (second path component under portables/)
          PORTABLE_BUNDLES=$(echo "$CHANGED_FILES" | grep -E '^portables/' | cut -d'/' -f2 | sort -u)

          if [ -z "$PORTABLE_BUNDLES" ]; then
            echo "No portable bundle changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Portable bundles to export:"
          echo "$PORTABLE_BUNDLES"

          BUNDLE_LIST=$(echo "$PORTABLE_BUNDLES" | sed 's/^/  - /')

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "portable_bundles<<EOF" >> $GITHUB_OUTPUT
          echo "$PORTABLE_BUNDLES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "bundle_list<<EOF" >> $GITHUB_OUTPUT
          echo "$BUNDLE_LIST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Export portables to CAC
        if: steps.detect-bundles.outputs.has_changes == 'true'
        run: |
          PORTABLE_BUNDLES="${{ steps.detect-bundles.outputs.portable_bundles }}"

          echo "$PORTABLE_BUNDLES" | while IFS= read -r bundle_name; do
            if [ -n "$bundle_name" ] && [ -d "integrations-deployment-templates/portables/$bundle_name" ]; then
              echo "Copying portables/$bundle_name → cac-tools-test/bundles/$bundle_name/"

              mkdir -p "cac-tools-test/bundles/$bundle_name"
              cp -r "integrations-deployment-templates/portables/$bundle_name/"* "cac-tools-test/bundles/$bundle_name/"

              echo "✓ Copied $bundle_name"
            fi
          done

      - name: Create PR in CAC Repo
        if: steps.detect-bundles.outputs.has_changes == 'true'
        run: |
          cd cac-tools-test

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -z $(git status --porcelain) ]]; then
            echo "No changes to commit"
            exit 0
          fi

          PR_NUMBER="${{ github.event.pull_request.number }}"
          COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          TRIGGERED_BY="${{ github.actor }}"
          TEST_PREFIX="[TEST] "

          BUNDLE_LIST="${{ steps.detect-bundles.outputs.bundle_list }}"

          BRANCH_NAME="push-to-cac-tools-test-${PR_NUMBER}-$(date +%s)"
          git checkout -b "$BRANCH_NAME"

          git add .
          git commit -m "${TEST_PREFIX}Push portable bundles from integration-deployment-templates

          Synced bundles:
          $BUNDLE_LIST

          From PR #${PR_NUMBER}
          Source commit: ${COMMIT_SHA}"

          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "${TEST_PREFIX}Sync portable bundles from integration-deployment-templates PR #${PR_NUMBER}" \
            --body "## Auto-sync from integration-deployment-templates

          **Synced bundles:**
          $BUNDLE_LIST

          **Source PR:** #${PR_NUMBER}
          **Source commit:** \`${COMMIT_SHA}\`
          **Triggered by:** @${TRIGGERED_BY}
          **Trigger type:** PR approval

          This PR was automatically generated to sync portable bundle changes from the integration-deployment-templates repository." \
            --base main \
            --head "$BRANCH_NAME"

          echo "Successfully created PR in CAC repository"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
