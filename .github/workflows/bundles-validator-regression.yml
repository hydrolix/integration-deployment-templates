name: Regression Test

on:
  push:
    branches:
      - regression-workflow
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Decode and Set Environment Variables
        run: |
          # Decode base64 secrets and set as environment variables
          echo "BUNDLE_TESTING_CLUSTER=$(echo '${{ secrets.BUNDLE_TESTING_CLUSTER }}' | base64 -d)" >> $GITHUB_ENV
          echo "BUNDLE_TESTING_USERNAME=$(echo '${{ secrets.BUNDLE_TESTING_USERNAME }}' | base64 -d)" >> $GITHUB_ENV
          echo "BUNDLE_TESTING_PASSWORD=$(echo '${{ secrets.BUNDLE_TESTING_PASSWORD }}' | base64 -d)" >> $GITHUB_ENV

      - name: Setup Docker
        run: |
          docker --version
          docker compose version
          
          # Ensure Docker daemon is running
          sudo systemctl status docker || sudo systemctl start docker

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Chrome/Chromium
        run: |
          sudo apt-get install -y chromium-browser chromium-chromedriver
          
          chromium-browser --version
          chromedriver --version
          
          echo "CHROME_BIN=/usr/bin/chromium-browser" >> $GITHUB_ENV
          echo "CHROMEDRIVER_BIN=/usr/bin/chromedriver" >> $GITHUB_ENV

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clean up any existing containers
        run: |
          docker stop $(docker ps -q) 2>/dev/null || true
          docker rm $(docker ps -aq) 2>/dev/null || true
          
          sudo pkill -f chrome || true
          sudo pkill -f chromium || true
          
          echo "=== Remaining containers ==="
          docker ps -a

      - name: Debug Port Check Before Tests
        run: |
          echo "=== Checking ports before test ==="
          netstat -tuln | grep -E ':(8[0-9]{3}|9000)' || echo "No ports in 8000-9000 range are in use"
          
          echo -e "\n=== Checking specific ports with lsof ==="
          for port in 8000 8080 9000 9222; do
            if sudo lsof -i:$port > /dev/null 2>&1; then
              echo "Port $port: IN USE by:"
              sudo lsof -i:$port
            else
              echo "Port $port: Available"
            fi
          done

      - name: Run Integration Tests
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: debug
          CHROME_DEBUG_PORT: 9222
        run: |
          if sudo lsof -i:9222 > /dev/null 2>&1; then
            echo "WARNING: Port 9222 is in use, letting Rust find alternative"
            unset CHROME_DEBUG_PORT
          fi
          
          cargo run -- --local

      - name: Post-test Docker Debug
        if: always()
        run: |
          echo "=== Final Docker Status ==="
          docker ps -a
          
          echo -e "\n=== Container Logs ==="
          for container in $(docker ps -a --format "{{.Names}}"); do
            echo "--- Logs for $container ---"
            docker logs $container --tail 50
          done

      - name: Cleanup
        if: always()
        run: |
          docker stop $(docker ps -q) 2>/dev/null || true
          sleep 2
          docker rm $(docker ps -aq) 2>/dev/null || true
          
          # Kill any remaining chrome processes
          sudo pkill -9 -f chrome 2>/dev/null || true
          sudo pkill -9 -f chromium 2>/dev/null || true