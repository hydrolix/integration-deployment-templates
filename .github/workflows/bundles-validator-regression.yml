name: Regression Test

on:
  push:
    branches:
      - regression-workflow
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Decode and Set Environment Variables
        run: |
          # Decode base64 secrets and set as environment variables
          echo "BUNDLE_TESTING_CLUSTER=$(echo '${{ secrets.BUNDLE_TESTING_CLUSTER }}' | base64 -d)" >> $GITHUB_ENV
          echo "BUNDLE_TESTING_USERNAME=$(echo '${{ secrets.BUNDLE_TESTING_USERNAME }}' | base64 -d)" >> $GITHUB_ENV
          echo "BUNDLE_TESTING_PASSWORD=$(echo '${{ secrets.BUNDLE_TESTING_PASSWORD }}' | base64 -d)" >> $GITHUB_ENV

      - name: Setup Docker
        run: |
          docker --version
          docker compose version
          
          # Ensure Docker daemon is running
          sudo systemctl status docker || sudo systemctl start docker

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Chrome/Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          
          chromium-browser --version
          chromedriver --version
          
          echo "CHROME_BIN=/usr/bin/chromium-browser" >> $GITHUB_ENV
          echo "CHROMEDRIVER_BIN=/usr/bin/chromedriver" >> $GITHUB_ENV

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Debug Docker Environment
        run: |
          echo "=== System Info ==="
          uname -a
          echo -e "\n=== Docker Info ==="
          docker info --format '{{json .}}' | jq '{ServerVersion, OSType, Architecture}'
          
          echo -e "\n=== Current Containers ==="
          docker ps -a --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
          
          echo -e "\n=== Current Images ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
          
          echo -e "\n=== Port Availability Check ==="
          for port in 3000 8000 8001 8002 8003 8004 8005 8006 8007 8008 8009 9000 9222; do
            if lsof -i:$port > /dev/null 2>&1; then
              echo "Port $port: IN USE"
              lsof -i:$port
            else
              echo "Port $port: Available"
            fi
          done

      - name: Run Integration Tests
        env:
          RUST_BACKTRACE: 1
        run: |
          cargo run -- --local

      - name: Post-test Docker Debug
        if: always()
        run: |
          echo "=== Final Docker Status ==="
          docker ps -a
          
          echo -e "\n=== Container Logs ==="
          for container in $(docker ps -a --format "{{.Names}}"); do
            echo "--- Logs for $container ---"
            docker logs $container --tail 50
          done