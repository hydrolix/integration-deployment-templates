name: bundle-validator

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: [main]
    paths:
      - 'aws/**'
      - 'trafficpeak/**'
      - 'portables/**'

jobs:
  bundle-validator:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'skip-bundle-format') ||
      contains(github.event.pull_request.body, '[skip-bundle-format]')
    container:
      image: rust:latest
    environment: bundle-validator-env

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Rust dependencies
      if: ${{ !env.ACT }}  # Skip cache when running locally with act
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build bundle validator
      run: |
        cargo build --release --bin bundle-validator

    - name: Run bundle-validator
      run: ./target/release/bundle-validator
      env:
        BUNDLE_TESTING_CLUSTER: ${{ secrets.BUNDLE_TESTING_CLUSTER }}
        BUNDLE_TESTING_USERNAME: ${{ secrets.BUNDLE_TESTING_USERNAME }}
        BUNDLE_TESTING_PASSWORD: ${{ secrets.BUNDLE_TESTING_PASSWORD }}
