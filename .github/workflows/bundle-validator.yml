name: bundle-validator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  bundle-validator:
    runs-on: ubuntu-latest
    environment: bundle-validator-env
    
    steps:
    - uses: actions/checkout@v4

    - name: Install Chrome dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libnss3-dev \
          libatk-bridge2.0-dev \
          libgtk-3-dev \
          libxss-dev \
          libgconf2-dev \
          libnspr4 \
          libnss3 \
          libatk-bridge2.0-0 \
          libgtk-3-0 \
          libxss1 \
          libgconf-2-4 \
          libasound2 \
          libx11-xcb1 \
          libxcomposite1 \
          libxcursor1 \
          libxdamage1 \
          libxi6 \
          libxtst6 \
          libxrandr2 \
          libxshmfence1

    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Verify Chrome works
      run: |
        # Use the full path to chrome since it's not in PATH
        /opt/hostedtoolcache/setup-chrome/chromium/stable/x64/chrome --version
        /opt/hostedtoolcache/setup-chrome/chromium/stable/x64/chrome --headless --disable-gpu --no-sandbox --dump-dom about:blank > /dev/null && echo "Chrome works!" || echo "Chrome test failed"
        
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache Rust dependencies
      # Skip cache in act (local testing) since it requires Node.js
      if: ${{ !env.ACT }}
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build bundle validator
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        cargo build --release --bin bundle-validator
    
    - name: Run bundle-validator
      run: ./target/release/bundle-validator
      env:
        BUNDLE_TESTING_CLUSTER: ${{ secrets.BUNDLE_TESTING_CLUSTER }}
        BUNDLE_TESTING_USERNAME: ${{ secrets.BUNDLE_TESTING_USERNAME }}
        BUNDLE_TESTING_PASSWORD: ${{ secrets.BUNDLE_TESTING_PASSWORD }}

