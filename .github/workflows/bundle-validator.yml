name: bundle-validator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  bundle-validator:
    runs-on: ubuntu-latest
    environment: bundle-validator-env
    
    steps:
    - uses: actions/checkout@v4

    - name: Install Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget
        
        # Download and install Chrome
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
        
        # Install dependencies
        sudo apt-get install -y \
          libnss3-dev \
          libatk-bridge2.0-dev \
          libgtk-3-dev \
          libxss-dev \
          libgconf2-dev
        
        # Verify installation
        google-chrome --version

    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache Rust dependencies
      # Skip cache in act (local testing) since it requires Node.js
      if: ${{ !env.ACT }}
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build bundle validator
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        cargo build --release --bin bundle-validator
    
    - name: Run bundle-validator
      run: ./target/release/bundle-validator
      env:
        BUNDLE_TESTING_CLUSTER: ${{ secrets.BUNDLE_TESTING_CLUSTER }}
        BUNDLE_TESTING_USERNAME: ${{ secrets.BUNDLE_TESTING_USERNAME }}
        BUNDLE_TESTING_PASSWORD: ${{ secrets.BUNDLE_TESTING_PASSWORD }}

