name: bundle-validator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  bundle-validator:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache Rust dependencies
      # Skip cache in act (local testing) since it requires Node.js
      if: ${{ !env.ACT }}
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build bundle validator
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        cargo build --release --bin bundle-validator
    
    - name: Run bundle-validator
      run: ./target/release/bundle-validator
      env:
        TESTING_BUNDLE_CLUSTER: ${{ secrets.TESTING_BUNDLE_CLUSTER }}
        TESTING_BUNDLE_USERNAME: ${{ secrets.TESTING_BUNDLE_USERNAME }}
        TESTING_BUNDLE_PASSWORD: ${{ secrets.TESTING_BUNDLE_PASSWORD }}

