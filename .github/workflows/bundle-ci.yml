name: bundle-ci

on:
  pull_request:
    branches: [main, LOTC-1203-two-track-pipeline]  # TODO: remove feature branch before merging to main
    paths:
      - 'aws/**'
      - 'trafficpeak/**'
      - 'portables/**'
      - '.originals/**'

permissions:
  contents: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-bundle-ci') }}
    outputs:
      full_pipeline_dirs: ${{ steps.detect.outputs.full_pipeline_dirs }}
      validate_only_dirs: ${{ steps.detect.outputs.validate_only_dirs }}
      has_full_pipeline: ${{ steps.detect.outputs.has_full_pipeline }}
      has_validate_only: ${{ steps.detect.outputs.has_validate_only }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect changed bundle directories and route tracks
        id: detect
        run: |
          # Full PR diff — used to determine WHICH bundles are affected
          ALL_PR_FILES=$(git diff --name-only origin/main...HEAD)

          echo "All PR changed files:"
          echo "$ALL_PR_FILES"

          # Latest push diff — used for TRACK ROUTING decisions
          # This excludes .originals/ files auto-committed by CI in previous runs
          # For the first push (no prior commits), falls back to the full PR diff
          LATEST_PUSH_FILES=""
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            LAST_MSG=$(git log -1 --format=%s HEAD)
            if echo "$LAST_MSG" | grep -q '\[skip ci\]'; then
              # Latest commit is a CI auto-commit — look at the one before it
              if git rev-parse HEAD~2 >/dev/null 2>&1; then
                LATEST_PUSH_FILES=$(git diff --name-only HEAD~2..HEAD~1 2>/dev/null || echo "")
              fi
            else
              LATEST_PUSH_FILES=$(git diff --name-only HEAD~1..HEAD)
            fi
          fi

          # Fall back to full PR diff if we couldn't determine latest push
          if [ -z "$LATEST_PUSH_FILES" ]; then
            LATEST_PUSH_FILES="$ALL_PR_FILES"
          fi

          echo ""
          echo "Latest push changed files (for track routing):"
          echo "$LATEST_PUSH_FILES"

          # Extract unique bundle dirs from full PR diff (which bundles are involved)
          BUNDLE_DIRS=$(echo "$ALL_PR_FILES" | grep -E '^(aws|trafficpeak)/' | cut -d'/' -f1-2 | sort -u)

          # Check for .originals/ changes in the LATEST PUSH only (not CI auto-commits)
          ORIGINALS_BUNDLE_DIRS=$(echo "$LATEST_PUSH_FILES" | grep -E '^\.originals/(aws|trafficpeak)/' | sed 's|^\.originals/||' | cut -d'/' -f1-2 | sort -u)

          # Merge both sets
          ALL_DIRS=$(echo -e "${BUNDLE_DIRS}\n${ORIGINALS_BUNDLE_DIRS}" | sort -u | grep -v '^$')

          if [ -z "$ALL_DIRS" ]; then
            echo "No bundle directories changed"
            echo "has_full_pipeline=false" >> $GITHUB_OUTPUT
            echo "has_validate_only=false" >> $GITHUB_OUTPUT
            echo "full_pipeline_dirs=[]" >> $GITHUB_OUTPUT
            echo "validate_only_dirs=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          FULL_DIRS=""
          VALIDATE_DIRS=""

          while IFS= read -r dir; do
            [ -z "$dir" ] && continue

            # Resolve the actual bundle dir (flat or versioned)
            BUNDLE_DIR=""
            if [ -f "$dir/bundle-config.json" ]; then
              BUNDLE_DIR="$dir"
            elif LATEST_VER=$(ls -d "$dir"/[0-9]*.* 2>/dev/null | sort -V | tail -1) && [ -f "$LATEST_VER/bundle-config.json" ]; then
              BUNDLE_DIR="$LATEST_VER"
            fi

            # Use detect_track.py to determine which track this bundle should run on
            # Pass LATEST PUSH files (not full PR diff) so CI auto-commits don't affect routing
            if [ -n "$BUNDLE_DIR" ]; then
              BUNDLE_CHANGED=$(echo "$LATEST_PUSH_FILES" | grep -E "^(\.originals/)?${dir}/" | tr '\n' ',' | sed 's/,$//')
              TRACK=$(python scripts/detect_track.py --bundle-dir "$BUNDLE_DIR" --changed-files "$BUNDLE_CHANGED" --mode track 2>&1) || TRACK="validate-only"

              echo "Bundle: $BUNDLE_DIR → Track: $TRACK"

              if [ "$TRACK" = "full" ]; then
                FULL_DIRS="${FULL_DIRS:+${FULL_DIRS}\n}${BUNDLE_DIR}"
              else
                VALIDATE_DIRS="${VALIDATE_DIRS:+${VALIDATE_DIRS}\n}${BUNDLE_DIR}"
              fi
            else
              # No bundle-config.json — check if this is a legacy bundle with changes
              echo "::warning::Bundle directory '$dir' has changes but no bundle-config.json — routing to validation only"
              if [ -d "$dir" ]; then
                VALIDATE_DIRS="${VALIDATE_DIRS:+${VALIDATE_DIRS}\n}${dir}"
              fi
            fi
          done <<< "$ALL_DIRS"

          # Convert to JSON arrays
          if [ -n "$FULL_DIRS" ]; then
            FULL_JSON=$(echo -e "$FULL_DIRS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "has_full_pipeline=true" >> $GITHUB_OUTPUT
          else
            FULL_JSON="[]"
            echo "has_full_pipeline=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$VALIDATE_DIRS" ]; then
            VALIDATE_JSON=$(echo -e "$VALIDATE_DIRS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "has_validate_only=true" >> $GITHUB_OUTPUT
          else
            VALIDATE_JSON="[]"
            echo "has_validate_only=false" >> $GITHUB_OUTPUT
          fi

          echo "full_pipeline_dirs=$FULL_JSON" >> $GITHUB_OUTPUT
          echo "validate_only_dirs=$VALIDATE_JSON" >> $GITHUB_OUTPUT

          echo ""
          echo "Track 1 (full pipeline): $FULL_JSON"
          echo "Track 2 (validate only): $VALIDATE_JSON"

  # Track 1: Full pipeline — format, configure, then validate
  format-bundles:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_full_pipeline == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Format and configure bundles (Track 1)
        run: |
          BUNDLE_DIRS='${{ needs.detect-changes.outputs.full_pipeline_dirs }}'

          echo "$BUNDLE_DIRS" | jq -r '.[]' | while IFS= read -r bundle_dir; do
            echo ""
            echo "========================================="
            echo "Processing (Track 1 - Full Pipeline): $bundle_dir"
            echo "========================================="

            python scripts/run_pipeline.py \
              --bundle-dir "$bundle_dir" \
              --config "$bundle_dir/bundle-config.json" \
              --track full \
              --skip-validate \
              --verbose

            echo "✓ Formatted $bundle_dir"
          done

      - name: Commit formatted bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add aws/ trafficpeak/ portables/ .originals/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[skip ci] Auto-format bundles via bundle-ci"
            git push
          fi

  # Track 1 continued: Validate after formatting
  validate-full-pipeline:
    needs: [detect-changes, format-bundles]
    if: always() && !contains(github.event.pull_request.labels.*.name, 'skip-bundle-ci') && needs.format-bundles.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: rust:latest
    environment: bundle-validator-env

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build bundle validator
        run: cargo build --release --bin bundle-validator

      - name: Run bundle-validator (Track 1)
        run: ./target/release/bundle-validator
        env:
          BUNDLE_TESTING_CLUSTER: ${{ secrets.BUNDLE_TESTING_CLUSTER }}
          BUNDLE_TESTING_USERNAME: ${{ secrets.BUNDLE_TESTING_USERNAME }}
          BUNDLE_TESTING_PASSWORD: ${{ secrets.BUNDLE_TESTING_PASSWORD }}

  # Track 2: Validation only — no formatting, no commit
  validate-only-bundles:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_validate_only == 'true'
    runs-on: ubuntu-latest
    container:
      image: rust:latest
    environment: bundle-validator-env

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build bundle validator
        run: cargo build --release --bin bundle-validator

      - name: Run bundle-validator (Track 2 - Validation Only)
        run: ./target/release/bundle-validator
        env:
          BUNDLE_TESTING_CLUSTER: ${{ secrets.BUNDLE_TESTING_CLUSTER }}
          BUNDLE_TESTING_USERNAME: ${{ secrets.BUNDLE_TESTING_USERNAME }}
          BUNDLE_TESTING_PASSWORD: ${{ secrets.BUNDLE_TESTING_PASSWORD }}
