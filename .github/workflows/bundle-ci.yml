name: bundle-ci

on:
  pull_request:
    branches: [main]
    paths:
      - 'aws/**'
      - 'trafficpeak/**'
      - 'portables/**'

permissions:
  contents: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      bundle_dirs: ${{ steps.detect.outputs.bundle_dirs }}
      has_bundles: ${{ steps.detect.outputs.has_bundles }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed bundle directories
        id: detect
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Extract unique bundle dirs (first two path components under aws/ or trafficpeak/)
          BUNDLE_DIRS=$(echo "$CHANGED_FILES" | grep -E '^(aws|trafficpeak)/' | cut -d'/' -f1-2 | sort -u)

          if [ -z "$BUNDLE_DIRS" ]; then
            echo "No bundle directories changed"
            echo "has_bundles=false" >> $GITHUB_OUTPUT
            echo "bundle_dirs=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Filter to dirs that have a bundle-config.json
          VALID_DIRS=""
          while IFS= read -r dir; do
            if [ -f "$dir/bundle-config.json" ]; then
              if [ -n "$VALID_DIRS" ]; then
                VALID_DIRS="${VALID_DIRS}
          ${dir}"
              else
                VALID_DIRS="$dir"
              fi
            else
              echo "::warning::Bundle directory '$dir' has changes but no bundle-config.json — skipping auto-format"
            fi
          done <<< "$BUNDLE_DIRS"

          if [ -z "$VALID_DIRS" ]; then
            echo "No bundles with bundle-config.json found"
            echo "has_bundles=false" >> $GITHUB_OUTPUT
            echo "bundle_dirs=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Bundles to process:"
          echo "$VALID_DIRS"

          # Convert to JSON array for downstream jobs
          JSON_ARRAY=$(echo "$VALID_DIRS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "bundle_dirs=$JSON_ARRAY" >> $GITHUB_OUTPUT
          echo "has_bundles=true" >> $GITHUB_OUTPUT

  format-bundles:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_bundles == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Format and configure bundles
        run: |
          BUNDLE_DIRS='${{ needs.detect-changes.outputs.bundle_dirs }}'

          echo "$BUNDLE_DIRS" | jq -r '.[]' | while IFS= read -r bundle_dir; do
            echo ""
            echo "========================================="
            echo "Processing: $bundle_dir"
            echo "========================================="

            python scripts/run_pipeline.py \
              --bundle-dir "$bundle_dir" \
              --config "$bundle_dir/bundle-config.json" \
              --skip-validate \
              --verbose

            echo "✓ Formatted $bundle_dir"
          done

      - name: Commit formatted bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add aws/ trafficpeak/ portables/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[skip ci] Auto-format bundles via bundle-ci"
            git push
          fi

  validate-bundles:
    needs: format-bundles
    runs-on: ubuntu-latest
    container:
      image: rust:latest
    environment: bundle-validator-env

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build bundle validator
        run: cargo build --release --bin bundle-validator

      - name: Run bundle-validator
        run: ./target/release/bundle-validator
        env:
          BUNDLE_TESTING_CLUSTER: ${{ secrets.BUNDLE_TESTING_CLUSTER }}
          BUNDLE_TESTING_USERNAME: ${{ secrets.BUNDLE_TESTING_USERNAME }}
          BUNDLE_TESTING_PASSWORD: ${{ secrets.BUNDLE_TESTING_PASSWORD }}

  push-to-cac-tools-test:
    needs: [detect-changes, validate-bundles]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.INTEGRATIONS_APP_ID }}
          private-key: ${{ secrets.INTEGRATIONS_APP_PRIVATE_KEY }}
          owner: hydrolix

      - name: Checkout Integrations Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: 'integrations-deployment-templates'
          fetch-depth: 0

      - name: Checkout CAC Test Repo
        uses: actions/checkout@v4
        with:
          repository: 'hydrolix/cac-tools-test'
          token: ${{ steps.app-token.outputs.token }}
          path: 'cac-tools-test'

      - name: Detect portable bundles
        id: detect-bundles
        run: |
          cd integrations-deployment-templates

          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          PORTABLE_BUNDLES=$(echo "$CHANGED_FILES" | grep -E '^portables/' | cut -d'/' -f2 | sort -u)

          if [ -z "$PORTABLE_BUNDLES" ]; then
            echo "No portable bundle changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Portable bundles to export:"
          echo "$PORTABLE_BUNDLES"

          BUNDLE_LIST=$(echo "$PORTABLE_BUNDLES" | sed 's/^/  - /')

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "portable_bundles<<EOF" >> $GITHUB_OUTPUT
          echo "$PORTABLE_BUNDLES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "bundle_list<<EOF" >> $GITHUB_OUTPUT
          echo "$BUNDLE_LIST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Export portables to CAC Test
        if: steps.detect-bundles.outputs.has_changes == 'true'
        run: |
          PORTABLE_BUNDLES="${{ steps.detect-bundles.outputs.portable_bundles }}"

          echo "$PORTABLE_BUNDLES" | while IFS= read -r bundle_name; do
            if [ -n "$bundle_name" ] && [ -d "integrations-deployment-templates/portables/$bundle_name" ]; then
              echo "Copying portables/$bundle_name → cac-tools-test/bundles/$bundle_name/"

              mkdir -p "cac-tools-test/bundles/$bundle_name"
              cp -r "integrations-deployment-templates/portables/$bundle_name/"* "cac-tools-test/bundles/$bundle_name/"

              echo "✓ Copied $bundle_name"
            fi
          done

      - name: Create PR in CAC Test Repo
        if: steps.detect-bundles.outputs.has_changes == 'true'
        run: |
          cd cac-tools-test

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -z $(git status --porcelain) ]]; then
            echo "No changes to commit"
            exit 0
          fi

          PR_NUMBER="${{ github.event.pull_request.number }}"
          COMMIT_SHA="${{ github.sha }}"
          TRIGGERED_BY="${{ github.event.pull_request.user.login }}"
          BUNDLE_LIST="${{ steps.detect-bundles.outputs.bundle_list }}"

          BRANCH_NAME="push-to-cac-tools-test-${PR_NUMBER}-$(date +%s)"
          git checkout -b "$BRANCH_NAME"

          git add .
          git commit -m "Push portable bundles from integration-deployment-templates

          Synced bundles:
          $BUNDLE_LIST

          From PR #${PR_NUMBER}
          Source commit: ${COMMIT_SHA}"

          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "Sync portable bundles from integration-deployment-templates PR #${PR_NUMBER}" \
            --body "## Auto-sync from integration-deployment-templates

          **Synced bundles:**
          $BUNDLE_LIST

          **Source PR:** #${PR_NUMBER}
          **Source commit:** \`${COMMIT_SHA}\`
          **Triggered by:** @${TRIGGERED_BY}

          This PR was automatically generated to sync portable bundle changes from the integration-deployment-templates repository." \
            --base main \
            --head "$BRANCH_NAME"

          echo "Successfully created PR in CAC Test repository"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
