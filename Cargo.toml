[package]
name = "bundle-validator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bundle-validator"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json","blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.120"
url = "2.5.4"
lazy_static = "1.5.0"
uuid = { version = "1.3", features = ["v4"] }
chrono = "0.4.41"
rand = "0.9.2"
base64 = "0.22.1"
bollard = "0.19.2"
futures-util = "0.3.31"
once_cell = "1.21.3"
#scraper = "0.23.1"
headless_chrome = {git = "https://github.com/rust-headless-chrome/rust-headless-chrome", features = ["fetch"]}
sha256 = "1.6.0"
sha2 = "0.10.9"
walkdir = "2.5.0"
regex = "1.11.2"


