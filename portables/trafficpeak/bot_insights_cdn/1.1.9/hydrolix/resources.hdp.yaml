transforms:
  logs:
    akamai_default_datastream:
      __extend__: transforms/akamai_datastream2_transform.json
      settings:
        output_columns:
          breadcrumbs:
            datatype:
              type: string
              index: false
              suppress: false
          unknown:
            datatype:
              type: map
              index: true
              catch_all: true
              elements:
                - type: string
                  index: true
                - type: string
                  index: true
              suppress: false
          request_host:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          hdx_cdn:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          bot_class:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          bot_intent:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          bot_producer:
            datatype:
              type: string
              index: false
              source:
                from_input_field: sql_transform
              suppress: false
          verified_bot_owner:
            datatype:
              type: string
              index: false
              source:
                from_input_field: sql_transform
              suppress: false
          ai_category:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          is_bot_traffic:
            datatype:
              type: boolean
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          client_asn:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          asn_type:
            datatype:
              type: string
              index: false
              source:
                from_input_field: sql_transform
              suppress: false
          bot_verification_tier:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          bot_confidence:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          resource_category:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          request_method:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          response_status_code:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          cache_was_cached:
            datatype:
              type: boolean
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          time_to_first_byte_ms:
            datatype:
              type: uint64
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          origin_time_to_first_byte_ms:
            datatype:
              type: uint64
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          client_ip:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          hdx_source_latency_sec:
            datatype:
              type: uint32
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          latency:
            datatype:
              type: uint32
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          user_agent:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          request_path:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          req_path_array:
            datatype:
              type: array
              index: true
              primary: false
              ignore: false
              elements:
                - type: string
                  index: true
              suppress: false
          request_path_norm:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          request_path_root:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          request_query_string:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          response_content_type:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          response_total_bytes:
            datatype:
              type: uint64
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          client_country_iso_code:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          user_agent_category:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
          user_agent_category_key:
            datatype:
              type: string
              index: true
              source:
                from_input_field: sql_transform
              suppress: false
        sql_transform:
          select:
            request_host: reqHost
            hdx_cdn: '''Akamai'''
            user_agent_category: dictGet('akamai_ua_cat_dict', 'ua_category', assumeNotNull(UA))
            user_agent_category_key: dictGet('akamai_ua_cat_dict', 'ua_category_key',
              assumeNotNull(UA))
            ai_category: dictGet('akamai_ua_cat_dict', 'ai_category', assumeNotNull(UA))
            is_bot_traffic: dictGet('akamai_ua_cat_dict', 'is_bot', assumeNotNull(UA))
            bot_class: dictGet('akamai_ua_cat_dict', 'bot_class', assumeNotNull(UA))
            bot_intent: dictGet('akamai_ua_cat_dict', 'bot_intent', assumeNotNull(UA))
            bot_producer: dictGet('akamai_ua_cat_dict', 'producer', assumeNotNull(UA))
            resource_category: multiIf(positionCaseInsensitive(assumeNotNull(reqPath),
              'robots.txt') > 0, 'robots.txt', positionCaseInsensitive(assumeNotNull(reqPath),
              'sitemap.xml') > 0, 'sitemap.xml', positionCaseInsensitive(assumeNotNull(reqPath),
              'ads.txt') > 0, 'ads.txt', positionCaseInsensitive(assumeNotNull(reqPath),
              'llms.txt') > 0, 'llms.txt', match(assumeNotNull(reqPath), '^/api/')
              OR match(assumeNotNull(reqPath), '/api/'), 'api', match(assumeNotNull(reqPath),
              '\\.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$'), 'static', match(assumeNotNull(reqPath),
              '\\.(html?|php|asp|jsp)$') OR assumeNotNull(reqPath) = '/' OR NOT match(assumeNotNull(reqPath),
              '\\.'), 'page', 'other')
            client_asn: toString(asn)
            asn_type: dictGetOrDefault('akamai_asn_type_dict', 'asn_type', toUInt32OrZero(toString(asn)),
              'unknown')
            verified_bot_owner: dictGetOrDefault('akamai_bot_ip_dict', 'bot_owner',
              toIPv4OrDefault(assumeNotNull(cliIP)), '')
            bot_verification_tier: multiIf(is_bot_traffic = 1 AND verified_bot_owner
              != '', 'verified', is_bot_traffic = 1 AND asn_type = 'isp', 'declared_unverified',
              is_bot_traffic = 1, 'unverified', 'not_bot')
            bot_confidence: multiIf(is_bot_traffic = 1 AND verified_bot_owner != '',
              'verified', is_bot_traffic = 1 AND asn_type = 'isp', 'suspicious', is_bot_traffic
              = 1 AND asn_type IN ('hosting', 'business'), 'plausible', is_bot_traffic
              = 1, 'unverified', 'not_bot')
            request_method: reqMethod
            response_status_code: toString(statusCode)
            cache_was_cached: multiIf(cacheStatus = 1, 1, breadcrumbs IS NULL OR empty(breadcrumbs),
              0, Origin_IP IS NULL OR empty(Origin_IP) OR Origin_IP = '127.0.0.1',
              1, 0)
            time_to_first_byte_ms: toUInt64(timeToFirstByte)
            origin_time_to_first_byte_ms: toUInt64OrZero(toString(Origin_TurnAroundTime))
            client_ip: cliIP
            hdx_source_latency_sec: datediff('s', reqTimeSec, now64(3))
            latency: datediff('s', reqTimeSec, now64(3))
            user_agent: UA
            request_path: reqPath
            req_path_array: splitByString('/', assumeNotNull(reqPath))
            request_path_norm: lower(cutQueryString(assumeNotNull(reqPath)))
            request_path_root: if(empty(arrayFilter(segment -> notEmpty(segment),
              splitByChar('/', request_path_norm))), '/', concat('/', arrayElement(arrayFilter(segment
              -> notEmpty(segment), splitByChar('/', request_path_norm)), 1)))
            request_query_string: queryStr
            response_content_type: rspContentType
            response_total_bytes: totalBytes
            client_country_iso_code: country
  siem:
    siem:
      __extend__: transforms/transform_siem.json
    siem-gz:
      __extend__: transforms/transform_siem_gz.json
